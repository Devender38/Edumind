version: '3.8'

services:
  resolvex-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: resolvex-dev-service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - RESOLVEX_AUTH_SECRET=resolvex-production-security-secret-key-32bytes-min
      - RESOLVEX_WORKER_CONCURRENCY=5
      - SHUTDOWN_GRACE_MS=30000
    volumes:
      - ./prisma:/app/prisma
    restart: unless-stopped
